name: Import Scrapper and Kom artwork

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-scrapper-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Download artwork
        run: |
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfRNsi-YzE_sHv0oPwf4mJekKVYt6-mGri-ODLFAg5pGu6S-DNmIrgpsnUOasi6qdz-4OmQlwHN4wB418lFfa66ChLUW8vVhgiL4WcSmwpjyFmuMCpxEth04eyLshkY8jJyMNPjqC_yWjLm64KI4nwpk_MKve2fuvdBC7xV2EWWNDxGVLQ=s2048?key=bwpaXHgenHPQkJdcvIGalQ" -o "/tmp/scrapper-main.png"
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUd5u9IOA1BPGvyG05VdpRMTIsFzzMeI_kM80laDj0VpdIJCkXOIN7j-vR1K9sHegtjTuslKp0IESE_TL_ribkNzWAlJDmRV-Oh1r1Lpu7froPGeyAWiar0-n88D0Xm6GQsSeti22ugPHIdq5IrB05QzWGj6u4gtqXbdZikXg3DcElrZzes=s2048?key=bwpaXHgenHPQkJdcvIGalQ" -o "/tmp/scrapper-cave-bear.png"
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUcY6zDJcsOc-UrPPc09W965UUI-GDkpRtHHSUc_1zHxB24loIkRLnLpfujo9EdSdyL2pXQT8NUbw8lzVsrsMUGKBh0VEMuIW_6A7nfPMtDz-NAtA422g4dve29wS11Q0bGsmmJ9OyyFWDzlW_rZQBj25y3vax5Ux7uUIoB2s_g8nnwH=s2048?key=bwpaXHgenHPQkJdcvIGalQ" -o "/tmp/scrapper-grinder.png"
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUdvTyj38w9jSREfiZx2uFCvVkOsUFD4CRBYv9PfeDZaU6vpltppEziGreZJbGlxrzEyuEOtBZiYY47Y-asy2l4UuZG2ElaZBcwbFaAPZJAsripQgxdlbPiSMjLi02VRjxn_KNvtcPDG97R42OqlylKzGXmaERrBarSe6rgo6FuRXLxE=s2048?key=bwpaXHgenHPQkJdcvIGalQ" -o "/tmp/scrapper-marvel.png"
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUcsNgO1T60ujqJvDCZmFY-Mp_9-_8us_3Vo0kjZoNXWdbhgzaKfH8_ekjaQwlXiYB7Y4jlX3CHYaUbbMeTxHU_00JJzgmbImI_5hCHnPlU9Z_PEnF4cmTXnsGwJiybZ7MyBCCj_LMU6uovLqrNz54TatEDq4o6KXmwgrPNN3Xp-MT-jVbA=s2048?key=bwpaXHgenHPQkJdcvIGalQ" -o "/tmp/scrapper-crusher.png"
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUcRx9fTkBqOrCV7WRvZdmLoD8QTOZPYB5HOApbjpGq8Xv127WioadmaP4BGhEHLaVm8qh910PZR9klizD6OSPffPCpLt6OprSq0LnZsz4KyxLLmOTkF4CQlJ5izsuT3kzrm63jrGpQqmZ9ZLqrUY3bHwr6otLB2dDWwQWXZxMgdtTI9ca0=s2048?key=bwpaXHgenHPQkJdcvIGalQ" -o "/tmp/scourger-kom.png"
      - name: Convert artwork
        run: |
          cwebp -quiet -q 88 -alpha_q 100 /tmp/scrapper-main.png -resize 989 1400 -o assets/scrapper-main.webp
          cwebp -quiet -q 88 -alpha_q 100 /tmp/scrapper-cave-bear.png -resize 0 1400 -o assets/scrapper-cave-bear.webp
          cwebp -quiet -q 88 -alpha_q 100 /tmp/scrapper-grinder.png -resize 1400 0 -o assets/scrapper-grinder.webp
          cwebp -quiet -q 88 -alpha_q 100 /tmp/scrapper-marvel.png -resize 1400 0 -o assets/scrapper-marvel.webp
          cwebp -quiet -q 88 -alpha_q 100 /tmp/scrapper-crusher.png -resize 0 1100 -o assets/scrapper-crusher.webp
          cwebp -quiet -q 88 -alpha_q 100 /tmp/scourger-kom.png -resize 1400 0 -o assets/scourger-kom.webp
      - name: Commit artwork
        run: |
          git pull --rebase origin main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.webp
          git rm .github/workflows/import-scrapper-assets.yml
          git commit -m "Add Scrapper artwork and Scourger Kom"
          git push
