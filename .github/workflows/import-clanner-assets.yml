name: Import Clanner artwork

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-clanner-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Download artwork
        run: |
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUeX3zfpQc0PUyy4vVn2hLNePzZ9bLCanPNGoITLq5_-cMmN28fpXgfrE6lu8GFEHLmqpFzzjUAOj-O7fkrnMzMv3AqZ5rS0Lq_sjj5CGk_xi8aGKcI34OWtoddyq8Ct8VOZFXOCKUehHrNdRBfdFBEHHctB9-f3-MvLSTU_JVRrIsQ6oMY=s2048?key=jF3fI03abKD3tDuvGlcZPA" -o /tmp/clanners-logo.png
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUf_FYi2PNI9O-fkHI_GkoRNoxSl4lD0G5jyaZwm9fJPITeThPxhGHNsAs1HyTtuHmSFbNtMw8HSVfG41MuetK-chd8SBJweDunhob8mi-RX1rL-2kU0cNO9iJrIxJDeePfUDmZVps6utVyXjo45oV21iA-aYQj8mDPS5izKpfg26fjU4lQ=s2048?key=jF3fI03abKD3tDuvGlcZPA" -o /tmp/clanner-main.png
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUeIMUeSJVZj6Kg6pq5yY858klmhQuK7pyLlyjz8YrYyIGy7gtvSILPs3HdF32Hgm2n3uHKWtEsUKTJJK9LL0tPqUkseExGkNKe7QlzPFGS9tycRh0O_MSqec4K4sqWCEkSXmC3piL5g-2rb7o135w6fgf6175CbsYLPslCjxYJlDh-x=s2048?key=jF3fI03abKD3tDuvGlcZPA" -o /tmp/clanner-hunter.png
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUf6IZ1_ZOzkXZ6EQYJsgMUwfFGlvfnR_g7vLP62DXvCS5poIvpgUX2zai1PFwK12WFzs-NDL9rAqp0uK6k1BFWd6uPlxC-1C19Ctl7auSIoLc8aAR27HQOSDRkj8q5dV_ieqh8d8bKem7QO5kt_XO08LCCZHcDqCm7qiKGBaZy9a8oM=s2048?key=jF3fI03abKD3tDuvGlcZPA" -o /tmp/pneumo-hammer.png
      - name: Convert and commit
        run: |
          cwebp -quiet -lossless /tmp/clanners-logo.png -o assets/clanners-logo.webp
          cwebp -quiet -q 86 -alpha_q 100 /tmp/clanner-main.png -o assets/clanner-main.webp
          cwebp -quiet -q 86 -alpha_q 100 /tmp/clanner-hunter.png -o assets/clanner-hunter.webp
          cwebp -quiet -q 88 -alpha_q 100 /tmp/pneumo-hammer.png -o assets/pneumo-hammer.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/clanners-logo.webp assets/clanner-main.webp assets/clanner-hunter.webp assets/pneumo-hammer.webp
          git rm .github/workflows/import-clanner-assets.yml
          git commit -m "Add Clanner artwork"
          git push
