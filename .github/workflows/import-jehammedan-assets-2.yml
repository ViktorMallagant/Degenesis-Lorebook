name: Import Jehammedan artwork

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-jehammedan-assets-2.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Download artwork
        run: |
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUeF_lTmMKF2I4XJBQucwTjAVAK-q7L2axHg8QhHOPDpPQJ8GwdovzGpyjjJ4tzqn1dkUTn5-O9eRaYsfmaw2PP3nskz9pU2hT-5qtMC77xI5Ja2NJnEmDkmiURqb9-zOL62LTy9c_G7KWpmbFBAS5roTypC88g6h-Mpn7V40YgvEyixj4M=s2048?key=DWzpNj79RjDaW9S9pQ16Rg" -o /tmp/jehammedans-logo.png
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfL-XJ0jUzPyyVSbisa--lJIBmg5ARHh-_D96MHz9Ss7quJgauw4EqLMi8a0oZei_tTRnsnq_WrDk2zg9oRx0tBQylLDYCMW_w8MwxqJP6CJpdf7-aXkzUDWRpRBZf_YczplQ-s8Bes6NOz1W2BKvq4ordzkmIOxUgb3WwY6d1r_IdAfYk=s2048?key=DWzpNj79RjDaW9S9pQ16Rg" -o /tmp/jehammedan-sword.png
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfw4OT3887eSPRgddGLT5dwXuSJd7PNaqkFYr__jeVCfZ5ulKflMPJMhouZldKgu5DV5LVj013cnyShNXPJXQTI2lnYYQVcFd5TDYYDtp3c7PKdbLWJ3KUTRGI05SgmRkJEQIdd690J1vRkjpMH_0CUNt6wB5BcfUJXtjvxodHwn801D_0=s2048?key=DWzpNj79RjDaW9S9pQ16Rg" -o /tmp/riding-pick.png
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUd6xd8bxfCfTm7qV1pBiGxaJQi-Z25GQGZfWuokC2Q1SQmnZE12GnAgj-SEpW5TRSjpoX-DDuKAc2NrHiMrdx2o6W3ahrvTHToTs2Kd_7GuhpHEXQCZQ9vGZGqf0er3wUiFYmzRO_SA1NDkP2aSoVoCnyoIatReJReaRmszfRyhduPl=s2048?key=DWzpNj79RjDaW9S9pQ16Rg" -o /tmp/scimitar.png
      - name: Convert and commit
        run: |
          cwebp -quiet -lossless /tmp/jehammedans-logo.png -o assets/jehammedans-logo.webp
          cwebp -quiet -q 86 -alpha_q 100 /tmp/jehammedan-sword.png -o assets/jehammedan-sword.webp
          cwebp -quiet -q 88 -alpha_q 100 /tmp/riding-pick.png -o assets/riding-pick.webp
          cwebp -quiet -q 88 -alpha_q 100 /tmp/scimitar.png -o assets/scimitar.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jehammedans-logo.webp assets/jehammedan-sword.webp assets/riding-pick.webp assets/scimitar.webp
          git rm .github/workflows/import-jehammedan-assets-2.yml
          git commit -m "Add Jehammedan artwork"
          git push
