name: Import Jehammedan artwork

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-jehammedan-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Download artwork
        run: |
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfwc6BsmT_BW0lX80cxnXRsEX5gwYP0qrxjtrl7qyZgwXA-8z83E4xw5gZ4bAjV2558ZKA44STFAWhyCYIixGpU24AQXVWGPqFw5-pD7NKm-DGTq6v42p55nauOOoaccRu3mRagZwRbP9WghNehFIJWkZgfUL5_fmAB3NAyVIjLzbm_V00=s2048?key=U_FdT_Sjml51DyiyBAYWeg" -o /tmp/jehammedan-main.png
      - name: Convert and commit
        run: |
          cwebp -quiet -q 86 -alpha_q 100 /tmp/jehammedan-main.png -o assets/jehammedan-main.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/jehammedan-main.webp
          git rm .github/workflows/import-jehammedan-assets.yml
          git commit -m "Add Jehammedan artwork"
          git push
