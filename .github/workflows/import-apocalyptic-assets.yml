name: Import Apocalyptic artwork

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-apocalyptic-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Download artwork
        run: |
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfttFl0QqpodUCg28SOd2dtC3KF25w_NNjwU3tjIrqbwNz5YLbHzUplWdlpTrGpURnIzZX2pAF535T7VdfpIzoMFr4P7fEN7qYOgnRfStAJoSUwB-NLdI0wn5EgbIdJbms4C-yxLDpn6IvqWuinlEtMuN-Kqit-vyWL8c8jt9yqUC3D=s2048?key=t69oERJkFKjGD0hZDkWJ2A" -o /tmp/apocalyptic-main.png
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUep7NlH1KV5Fl5NzyRI3yudNgCr82V3OEnZLThi8DX4HKIk0vJyCwJj72ZD4df3SDoyUxZuz3Q-4v47PxTqdwLT4ltSa-p_Q7lg1FusJM0FI_FBiGf-FBWK7-Tv0Kj1QzHsdbKcV7XM2w5ps3bZ6viZWLDKuCvtELpfgk9R68nj0xMExNk=s2048?key=t69oERJkFKjGD0hZDkWJ2A" -o /tmp/apocalyptic-buzzard.png
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfQQNEYvgBKXJxIKQ3hUBklge9Q_qVWmirMyF0DBBbq-QAPmpS-eyUW6C6qpZH0Hyi-4tJN_jc7tg-q_0moulxR9rp0ULICnNwFUaZE7ULIRw2kv7h7clITrMPnC_JS8mBJ6hKu6Zwzu9f4W8r8E0oxRQXlEmM7tUOSyp1URo4SukyGXJA=s2048?key=t69oERJkFKjGD0hZDkWJ2A" -o /tmp/blade-bracelet.png
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfxuX1KFszI476D1XpuxhTz512XbwM4eIA0_Cm6wjzOmuaXZ6ZBv8E8m7JZEQV0C9k82d8G-pQl9LknnXNjAE3zLD1ML73lZBfT2HOlX1ev0M3g90Xvih-M-fNnJOq3sXdA2eqpPc5_9ttAVVxhAVv6BbxoBo7XfV-3suVmaCxHjByP=s2048?key=t69oERJkFKjGD0hZDkWJ2A" -o /tmp/apocalyptics-logo.png
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUfEojov52sHCrvAMvBIwL4WQpFYS2UmtaVUFWJBD10MEAUjNqS9BvapSrSt3tLkuzQEvM2VredkELRZgeQHMKD0U10-PyDNQe1TIgsDxmvTriuBc80f_0YE6E2tqb62l40uPpbAF5fvZE-_0owUFPvsRjEKdwIDTkfF7cZ6uy6JXICG4e0=s2048?key=t69oERJkFKjGD0hZDkWJ2A" -o /tmp/harpoon-crossbow.png
      - name: Convert and commit
        run: |
          cwebp -quiet -q 84 -alpha_q 100 /tmp/apocalyptic-main.png -o assets/apocalyptic-main.webp
          cwebp -quiet -q 84 -alpha_q 100 /tmp/apocalyptic-buzzard.png -o assets/apocalyptic-buzzard.webp
          cwebp -quiet -q 86 -alpha_q 100 /tmp/blade-bracelet.png -o assets/blade-bracelet.webp
          cwebp -quiet -lossless /tmp/apocalyptics-logo.png -o assets/apocalyptics-logo.webp
          cwebp -quiet -q 86 -alpha_q 100 /tmp/harpoon-crossbow.png -o assets/harpoon-crossbow.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apocalyptic-main.webp assets/apocalyptic-buzzard.webp assets/blade-bracelet.webp assets/apocalyptics-logo.webp assets/harpoon-crossbow.webp
          git rm .github/workflows/import-apocalyptic-assets.yml
          git commit -m "Add Apocalyptic artwork"
          git push
