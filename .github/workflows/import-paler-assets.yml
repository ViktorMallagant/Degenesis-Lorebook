name: Import Paler artwork

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-paler-assets.yml"

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          sudo apt-get update
          sudo apt-get install -y webp
      - name: Download artwork
        run: |
          curl -fL "https://lh7-rt.googleusercontent.com/slidesz/AGV_vUf_9r8HxOQzVG4Xr302pFJy-2E1xj_lUrVYhgRMgPzt-6QqM9Rd17kyR2PXjxnzFTUJHbKN4aj4jpxUJbKrhPs_9On-XLlwDVbwSA6h4CsSF0rXq_u0XwVvuwquXRaGEsOW1Nv9-u_nI8tBGYjsCMuk-ousC6ZaJThxVTgCOwZQ4kicdYM=s2048?key=1_au3kZDNoMEmntr27BAtw" -o /tmp/paler-main.png
      - name: Convert and commit
        run: |
          cwebp -quiet -q 86 -alpha_q 100 /tmp/paler-main.png -resize 989 1400 -o assets/paler-main.webp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/paler-main.webp
          git rm .github/workflows/import-paler-assets.yml
          git commit -m "Add Paler artwork"
          git push
